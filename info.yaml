# Tiny Tapeout project information
project:
  title:        "Reaction Timer Game"      # Project title
  author:       "Erick Martinez"           # Your name
  discord:      ""                         # Optional
  description:  "A game that measures reaction time to a GO signal"
  language:     "Verilog" 
  clock_hz:     10000000                   # 10MHz is standard, adjust if needed

  # How many tiles your design occupies.
  tiles: "1x1"          

  # Your top module name must start with "tt_um_". 
  # Note: You should rename your module in user_module_reaction_timer.v to match this!
  top_module:  "tt_um_emart155_reaction_timer"

  # List your project's source files here.
  source_files:
    - "reaction_timer.v"
    - "user_module_reaction_timer.v"

# The pinout of your project. 
pinout:
  # Inputs
  ui[0]: "start_button"
  ui[1]: "react_button"
  ui[2]: ""
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "ready_led"
  uo[1]: "go_led"
  uo[2]: "reaction_time[0]"
  uo[3]: "reaction_time[1]"
  uo[4]: "reaction_time[2]"
  uo[5]: "reaction_time[3]"
  uo[6]: "reaction_time[4]"
  uo[7]: "reaction_time[5]"

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6 